<script>
(function () {
  var mq = window.matchMedia('(max-width: 700px), ((pointer: coarse) and (max-width: 1024px))');
  function apply() {
    var mode = mq.matches ? 'mobile' : 'desktop';
    if (document.documentElement.dataset.layout === mode) return;
    document.documentElement.dataset.layout = mode;
    window.dispatchEvent(new CustomEvent('loslayout', { detail: mode }));
  }
  if (mq.addEventListener) mq.addEventListener('change', apply);
  else mq.addListener(apply);
  apply();
})();
</script>

<script>
const QUESTIONS = [{"p": 1, "n": 1, "t": "tossup", "part": null, "id": "676f82f0c626ea977c7a32ff", "a": "Amos Tutuola", "cat": "Literature", "sub": "World Literature", "slug": "amos_tutuola", "topic": "Amos Tutuola"}, {"p": 1, "n": 2, "t": "tossup", "part": null, "id": null, "a": "Tutuola", "cat": "Literature", "sub": "World Literature", "slug": "amos_tutuola", "topic": "Amos Tutuola"}, {"p": 1, "n": 3, "t": "bonus", "part": 0, "id": null, "a": "Christopher Okigbo", "cat": "Literature", "sub": "World Literature", "slug": "christopher_okigbo", "topic": "Christopher Okigbo"}, {"p": 2, "n": 1, "t": "bonus", "part": 1, "id": null, "a": "The Palm-Wine Drinkard", "cat": "Literature", "sub": "World Literature", "slug": "amos_tutuola", "topic": "Amos Tutuola"}, {"p": 2, "n": 2, "t": "tossup", "part": null, "id": null, "a": "kites", "cat": "Literature", "sub": "World Literature", "slug": null, "topic": null}, {"p": 2, "n": 3, "t": "tossup", "part": null, "id": null, "a": "Tutuola", "cat": "Science", "sub": "Biology", "slug": null, "topic": null}];
const R2_SET = "fixture_set";
</script>
<script src="../../guides_data.js"></script>
<script src="../../../lib/js/qdata.js"></script>
<script src="../../../lib/js/search_nav.js"></script>
<script src="../../../lib/js/map_view.js"></script>
<script>
initSearchNav('.nav-search', { prefix: '../../../' });

const offCats = new Set();
let gapsOnly = false;
let view = 'packet';
let mapCtl = null;

const CAT_ORDER = [...new Set(QUESTIONS.map(q => q.cat))].sort();

function qLabel(q) {
    if (q.t === 'tossup') return 'T' + q.n;
    return 'B' + q.n + 'abc'[q.part ?? 0];
}

function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function answerHtml(q) {
    if (q.slug) {
        const via = (q.topic && q.topic.toLowerCase() !== q.a.toLowerCase())
            ? `<span class="via-topic"> &rarr; ${esc(q.topic)}</span>` : '';
        return `<a href="../../${encodeURIComponent(q.slug)}/stock.html">${esc(q.a)}</a>${via}`;
    }
    return `<span class="no-page" title="No page yet">${esc(q.a)}</span>`;
}

function visibleQuestions() {
    return QUESTIONS.filter(q =>
        !offCats.has(q.cat) && (!gapsOnly || !q.slug));
}

function rowHtml(q, showCat) {
    const cat = showCat
        ? `<td class="q-cat">${esc(q.sub && q.sub !== q.cat ? q.sub : q.cat)}</td>`
        : '';
    const qbtn = q.id
        ? `<button class="qtext-btn" data-qi="${QUESTIONS.indexOf(q)}" title="Show question" aria-expanded="false">question</button>`
        : '';
    return `<tr><td class="q-label">${qLabel(q)}</td>` +
           `<td class="q-answer">${answerHtml(q)}${qbtn}</td>${cat}</tr>`;
}

function groupHead(title, rows) {
    const have = rows.filter(q => q.slug).length;
    const sum = gapsOnly
        ? `${rows.length} without a study page`
        : `${have} of these ${rows.length} ${have === 1 ? 'has' : 'have'} a study page`;
    return `<div class="group-head-row"><h2 class="group-head">${esc(title)}</h2>` +
           `<span class="group-sum">${sum}</span></div>`;
}

function renderBody() {
    const qs = visibleQuestions();
    const body = document.getElementById('body');
    const mapWrap = document.getElementById('map-wrap');
    document.getElementById('visible-count').textContent =
        (qs.length === QUESTIONS.length) ? '' : `showing ${qs.length.toLocaleString('en-US')}`;

    if (view === 'map') {
        body.innerHTML = '';
        mapWrap.style.display = '';
        renderMap(qs);
        return;
    }
    mapWrap.style.display = 'none';

    if (!qs.length) {
        body.innerHTML = '<div class="empty-note">Nothing matches the current filters.</div>';
        return;
    }
    let html = '';
    if (view === 'packet') {
        const packets = [...new Set(qs.map(q => q.p))].sort((a, b) => a - b);
        for (const p of packets) {
            const inPacket = qs.filter(q => q.p === p).sort((a, b) =>
                (a.t === b.t ? (a.n - b.n || (a.part ?? -1) - (b.part ?? -1))
                             : (a.t === 'tossup' ? -1 : 1)));
            html += groupHead('Packet ' + p, inPacket) +
                `<table class="q-table">${inPacket.map(q => rowHtml(q, true)).join('')}</table>`;
        }
    } else {
        for (const cat of CAT_ORDER) {
            const inCat = qs.filter(q => q.cat === cat);
            if (!inCat.length) continue;
            html += groupHead(cat, inCat);
            const subs = [...new Set(inCat.map(q => q.sub))].sort();
            for (const sub of subs) {
                const inSub = inCat.filter(q => q.sub === sub)
                    .sort((a, b) => a.a.localeCompare(b.a));
                if (subs.length > 1 || sub !== cat) {
                    html += `<h3 class="subgroup-head">${esc(sub)}</h3>`;
                }
                html += `<table class="q-table">${inSub.map(q => rowHtml(q, false)).join('')}</table>`;
            }
        }
    }
    html += '<div class="legend">Blue answerlines have a study page; red ones don’t yet.</div>';
    body.innerHTML = html;
}

function renderMap(qs) {
    // One map item per distinct linked topic among visible rows.
    const bySlug = new Map();
    let unlinked = 0;
    for (const q of qs) {
        if (!q.slug) { unlinked++; continue; }
        if (!bySlug.has(q.slug)) {
            bySlug.set(q.slug, {
                name: q.topic || q.a,
                country: guideCountry(q.slug),
                year: guideYear(q.slug),
                group: q.cat,
                href: '../../' + encodeURIComponent(q.slug) + '/stock.html',
                meta: q.sub && q.sub !== q.cat ? q.sub : '',
            });
        }
    }
    const items = [...bySlug.values()];
    const note = document.getElementById('map-note');
    const setNote = (unlocated) => {
        const parts = [];
        if (unlinked) parts.push(`${unlinked} answerlines without pages are not mapped`);
        if (unlocated.length) parts.push(`${unlocated.length} topics have no location`);
        note.textContent = parts.join(' · ');
    };
    if (!mapCtl) {
        mapCtl = initMapView(document.getElementById('map-box'), items,
                             { onUnlocated: setNote });
    } else {
        mapCtl.refresh(items);
        setTimeout(() => mapCtl.map.invalidateSize(), 0);
    }
}

function renderChips() {
    const box = document.getElementById('cat-chips');
    box.innerHTML = CAT_ORDER.map(cat => {
        const inCat = QUESTIONS.filter(q => q.cat === cat);
        const have = inCat.filter(q => q.slug).length;
        const isOff = offCats.has(cat);
        return `<button class="cat-chip${isOff ? ' off' : ''}" data-cat="${esc(cat)}" ` +
               `aria-pressed="${!isOff}">${esc(cat)}` +
               `<span class="chip-count">${have}/${inCat.length}</span></button>`;
    }).join('');
    box.querySelectorAll('.cat-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const cat = chip.dataset.cat;
            if (offCats.has(cat)) offCats.delete(cat); else offCats.add(cat);
            renderChips();
            renderBody();
        });
    });
}

document.getElementById('gaps-toggle').addEventListener('change', function () {
    gapsOnly = this.checked;
    renderBody();
});
document.querySelectorAll('.toggle-btn[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
        view = btn.dataset.view;
        document.querySelectorAll('.toggle-btn[data-view]').forEach(b => {
            b.classList.toggle('on', b === btn);
            b.setAttribute('aria-selected', String(b === btn));
        });
        renderBody();
    });
});

// Question-text expansion (event delegation over re-rendered tables).
// Text lives in the set's R2 shard; fetched once on first expand.
let qDocs = null;
function loadQDocs() {
    return qdataFetch('sets/' + R2_SET + '.json').then(set => {
        if (!qDocs) {
            qDocs = new Map();
            for (const p of set.packets || []) {
                for (const t of p.tossups || []) qDocs.set(t._id, t);
                for (const b of p.bonuses || []) qDocs.set(b._id, b);
            }
        }
        return qDocs;
    });
}
function rowText(q, docs) {
    const doc = docs.get(q.id);
    if (!doc) return '';
    if (q.t === 'bonus') {
        const parts = doc.parts_sanitized || [];
        return ((doc.leadin_sanitized || '') + ' ' + (parts[q.part ?? 0] || '')).trim();
    }
    return doc.question_sanitized || '';
}
document.getElementById('body').addEventListener('click', e => {
    const btn = e.target.closest('.qtext-btn');
    if (!btn) return;
    const tr = btn.closest('tr');
    if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('qtext-row')) {
        tr.nextElementSibling.remove();
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        return;
    }
    btn.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    const q = QUESTIONS[parseInt(btn.dataset.qi)];
    const row = document.createElement('tr');
    row.className = 'qtext-row';
    row.innerHTML = `<td colspan="${tr.children.length}">Loading…</td>`;
    tr.after(row);
    loadQDocs().then(docs => {
        row.firstElementChild.innerHTML = esc(rowText(q, docs) || 'Question text unavailable.');
    }).catch(err => {
        row.firstElementChild.innerHTML = qdataErrorHtml(err);
    });
});

renderChips();
renderBody();
</script>
</body>
